# Local environment: MySQL + one-off migration job + GraphQL API + React frontend.
#   cp .env.example .env && docker compose up --build -d
name: bitcot-ems

x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-employee_db}
  DB_USER: ${DB_USER:-employee_app}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
  DB_SSL: "false"

x-graphql-build: &graphql-build
  context: .
  dockerfile: graphql-server/Dockerfile

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${DB_NAME:-employee_db}
      MYSQL_USER: ${DB_USER:-employee_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # One-off job: applies database/migrations (and seeds) then exits.
  # Mirrors the production flow, where the same image runs as a one-off ECS task.
  migrate:
    build: *graphql-build
    image: bitcot-ems/graphql-server:local
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      <<: *db-env
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_DATABASE: ${SEED_DATABASE:-true}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  graphql-server:
    build: *graphql-build
    image: bitcot-ems/graphql-server:local
    restart: unless-stopped
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      GRAPHQL_INTROSPECTION: ${GRAPHQL_INTROSPECTION:-true}
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    image: bitcot-ems/frontend:local
    restart: unless-stopped
    environment:
      GRAPHQL_URL: ${FRONTEND_GRAPHQL_URL:-http://localhost:4000/graphql}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:8080"
    depends_on:
      graphql-server:
        condition: service_healthy

volumes:
  mysql-data:
